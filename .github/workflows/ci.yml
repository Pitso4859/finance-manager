name: Java CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application
        run: mvn --batch-mode --no-transfer-progress clean test-compile package

      - name: Run core smoke test
        run: java -ea -cp "target/classes:target/test-classes" com.financemanager.CoreSmokeTest

      - name: Run service integration test
        run: java -ea -cp "target/classes:target/test-classes" com.financemanager.ServiceIntegrationTest

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Account')}"></head>
<body class="auth-page">

<div class="min-vh-100 d-flex align-items-center justify-content-center px-3 py-4">
  <div style="width:100%;max-width:460px;">

    <!-- Logo -->
    <div class="text-center mb-4">
      <div style="width:52px;height:52px;background:rgba(0,214,143,.1);border:1px solid rgba(0,214,143,.3);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.93V18h-2v-1.07C9.14 16.56 8 15.26 8 13.5c0-.28.22-.5.5-.5s.5.22.5.5c0 1.1.89 2 2 2s2-.9 2-2-1.79-2-2-2c-1.93 0-3.5-1.57-3.5-3.5 0-1.76 1.14-3.06 2.5-3.43V3h2v1.07c1.36.37 2.5 1.67 2.5 3.43 0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-1.1-.89-2-2-2s-2 .9-2 2 1.79 2 2 2c1.93 0 3.5 1.57 3.5 3.5 0 1.76-1.14 3.06-2.5 3.43z" fill="#00d68f"/>
        </svg>
      </div>
      <h3 style="font-size:22px;font-weight:700;letter-spacing:-.03em;color:#e8edf5;">Create Account</h3>
      <p style="font-size:13px;color:#8892a4;margin-top:4px;">Start managing your finances today</p>
    </div>

    <div class="card">
      <div class="card-body" style="padding:28px;">
        <form th:action="@{/auth/register}" method="post" th:object="${form}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <!-- Full Name -->
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </span>
              <input type="text" th:field="*{fullName}"
                     class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                     placeholder="Your full name" required/>
              <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2"/>
                  <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="2"/>
                </svg>
              </span>
              <input type="email" th:field="*{email}"
                     class="form-control" th:classappend="${emailError != null} ? 'is-invalid'"
                     placeholder="you@example.com" required/>
              <div class="invalid-feedback" th:text="${emailError}"></div>
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                  <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                </svg>
              </span>
              <input type="password" th:field="*{password}"
                     class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                     placeholder="Min. 8 characters" required/>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password')" style="border-left:none;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                </svg>
              </button>
              <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
            <div class="form-text">Must be at least 8 characters.</div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                  <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                  <path d="M9 16l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <input type="password" th:field="*{confirmPassword}"
                     class="form-control" th:classappend="${passwordError != null} ? 'is-invalid'"
                     placeholder="Repeat password" required/>
              <div class="invalid-feedback" th:text="${passwordError}"></div>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 justify-content-center" style="padding:10px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 7a4 4 0 100 8 4 4 0 000-8zM19 8v6M22 11h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Create Account
          </button>
        </form>

        <div style="border-top:1px solid var(--border);margin:24px 0;"></div>
        <p class="text-center mb-0" style="font-size:13px;color:var(--text-secondary);">
          Already have an account?
          <a th:href="@{/auth/login}" style="color:var(--green);font-weight:600;text-decoration:none;">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
  function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>

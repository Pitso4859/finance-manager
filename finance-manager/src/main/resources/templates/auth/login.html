<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body class="auth-page">

<div class="min-vh-100 d-flex align-items-center justify-content-center px-3">
  <div style="width:100%;max-width:420px;">

    <!-- Logo -->
    <div class="text-center mb-5">
      <div style="width:52px;height:52px;background:rgba(0,214,143,.1);border:1px solid rgba(0,214,143,.3);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.93V18h-2v-1.07C9.14 16.56 8 15.26 8 13.5c0-.28.22-.5.5-.5s.5.22.5.5c0 1.1.89 2 2 2s2-.9 2-2-1.79-2-2-2c-1.93 0-3.5-1.57-3.5-3.5 0-1.76 1.14-3.06 2.5-3.43V3h2v1.07c1.36.37 2.5 1.67 2.5 3.43 0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-1.1-.89-2-2-2s-2 .9-2 2 1.79 2 2 2c1.93 0 3.5 1.57 3.5 3.5 0 1.76-1.14 3.06-2.5 3.43z" fill="#00d68f"/>
        </svg>
      </div>
      <h3 style="font-size:22px;font-weight:700;letter-spacing:-.03em;color:#e8edf5;">FinanceManager</h3>
      <p style="font-size:13px;color:#8892a4;margin-top:4px;">Sign in to your account</p>
    </div>

    <div class="card">
      <div class="card-body" style="padding:28px;">

        <!-- Error Alert -->
        <div th:if="${loginError}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span th:text="${loginError}">Invalid credentials.</span>
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
        </div>

        <!-- Success Alert -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span th:text="${successMessage}"></span>
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
        </div>

        <!-- Logout Alert -->
        <div th:if="${logoutMessage}" class="alert alert-info alert-dismissible fade show mb-4" role="alert">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span th:text="${logoutMessage}"></span>
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
        </div>

        <!-- Login Form -->
        <form th:action="@{/auth/login}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="mb-3">
            <label for="username" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2"/>
                  <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="2"/>
                </svg>
              </span>
              <input type="email" id="username" name="username"
                     class="form-control" placeholder="you@example.com"
                     autocomplete="email" required autofocus/>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
                  <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2"/>
                </svg>
              </span>
              <input type="password" id="password" name="password"
                     class="form-control" placeholder="••••••••"
                     autocomplete="current-password" required/>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password')" style="border-left:none;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe"/>
              <label class="form-check-label" for="rememberMe" style="font-size:12.5px;color:var(--text-secondary);">Remember me</label>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 justify-content-center" style="padding:10px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Sign In
          </button>
        </form>

        <div style="border-top:1px solid var(--border);margin:24px 0;"></div>

        <p class="text-center mb-0" style="font-size:13px;color:var(--text-secondary);">
          Don't have an account?
          <a th:href="@{/auth/register}" style="color:var(--green);font-weight:600;text-decoration:none;">Create one free</a>
        </p>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
  function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transaction')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page-body">
  <div th:replace="~{fragments/layout :: alerts}"></div>

  <div style="max-width:640px;">
    <!-- Header -->
    <div class="d-flex align-items-center gap-3 page-header">
      <a th:href="@{/transactions}" class="btn btn-outline-secondary btn-sm" style="padding:7px 10px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div>
        <h4 class="page-title" th:text="${transactionId != null} ? 'Edit Transaction' : 'New Transaction'"></h4>
        <p class="page-subtitle">Fill in the details below</p>
      </div>
    </div>

    <div class="card">
      <div class="card-body" style="padding:26px;">
        <form th:action="${transactionId != null} ? @{/transactions/{id}/edit(id=${transactionId})} : @{/transactions}"
              method="post" th:object="${request}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <!-- Type Selector -->
          <div class="mb-4">
            <label class="form-label">Transaction Type <span style="color:var(--red)">*</span></label>
            <div class="type-toggle">
              <div th:each="type : ${types}" style="flex:1;">
                <input type="radio" class="btn-check" th:id="${'type-' + type.name()}"
                       name="type" th:value="${type.name()}"
                       th:checked="${request.type != null and request.type.name() == type.name()}"/>
                <label class="btn w-100 justify-content-center"
                       th:classappend="${type.name() == 'INCOME'} ? 'btn-outline-success' : 'btn-outline-danger'"
                       th:for="${'type-' + type.name()}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" th:if="${type.name() == 'INCOME'}">
                    <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" th:unless="${type.name() == 'INCOME'}">
                    <path d="M12 5v14M19 12l-7 7-7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span th:text="${type.name()}"></span>
                </label>
              </div>
            </div>
            <div style="font-size:11.5px;color:var(--red);margin-top:4px;" th:errors="*{type}"></div>
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Description <span style="color:var(--red)">*</span></label>
            <input type="text" th:field="*{description}"
                   class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                   placeholder="e.g. Monthly Salary, Grocery Shopping"/>
            <div class="invalid-feedback" th:errors="*{description}"></div>
          </div>

          <!-- Amount + Category -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Amount (R) <span style="color:var(--red)">*</span></label>
              <div class="input-group">
                <span class="input-group-text" style="font-family:var(--font-mono);font-weight:600;">R</span>
                <input type="number" th:field="*{amount}" step="0.01" min="0.01"
                       class="form-control" th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"
                       placeholder="0.00"/>
                <div class="invalid-feedback" th:errors="*{amount}"></div>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Category <span style="color:var(--red)">*</span></label>
              <select th:field="*{category}" class="form-select"
                      th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                <option value="">Select category</option>
                <optgroup label="Income">
                  <option value="SALARY">Salary</option>
                  <option value="FREELANCE">Freelance</option>
                  <option value="INVESTMENT">Investment</option>
                  <option value="GIFT">Gift</option>
                  <option value="OTHER_INCOME">Other Income</option>
                </optgroup>
                <optgroup label="Expense">
                  <option value="FOOD">Food</option>
                  <option value="TRANSPORT">Transport</option>
                  <option value="HOUSING">Housing</option>
                  <option value="UTILITIES">Utilities</option>
                  <option value="HEALTHCARE">Healthcare</option>
                  <option value="EDUCATION">Education</option>
                  <option value="ENTERTAINMENT">Entertainment</option>
                  <option value="CLOTHING">Clothing</option>
                  <option value="SAVINGS">Savings</option>
                  <option value="OTHER_EXPENSE">Other Expense</option>
                </optgroup>
              </select>
              <div class="invalid-feedback" th:errors="*{category}"></div>
            </div>
          </div>

          <!-- Date -->
          <div class="mb-3">
            <label class="form-label">Date <span style="color:var(--red)">*</span></label>
            <input type="date" th:field="*{transactionDate}"
                   class="form-control" th:classappend="${#fields.hasErrors('transactionDate')} ? 'is-invalid'"
                   th:max="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"/>
            <div class="invalid-feedback" th:errors="*{transactionDate}"></div>
          </div>

          <!-- Notes -->
          <div class="mb-5">
            <label class="form-label">
              Notes
              <span style="font-size:11.5px;color:var(--text-muted);font-weight:400;">(optional)</span>
            </label>
            <textarea th:field="*{notes}" class="form-control" rows="2"
                      placeholder="Any additional details..."></textarea>
          </div>

          <!-- Actions -->
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success px-4">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span th:text="${transactionId != null} ? 'Update Transaction' : 'Save Transaction'"></span>
            </button>
            <a th:href="@{/transactions}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

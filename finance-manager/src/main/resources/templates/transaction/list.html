<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transactions')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page-body">
  <div th:replace="~{fragments/layout :: alerts}"></div>

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-start page-header">
    <div>
      <h4 class="page-title">Transactions</h4>
      <p class="page-subtitle" th:text="${transactions.totalElements} + ' total transactions'"></p>
    </div>
    <a th:href="@{/transactions/new}" class="btn btn-success">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      Add Transaction
    </a>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="card-body p-0">
      <div th:if="${transactions.isEmpty()}" class="empty-state">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" display="block" style="margin:0 auto 14px;">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p style="margin-bottom:16px;">No transactions yet</p>
        <a th:href="@{/transactions/new}" class="btn btn-success btn-sm">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          Add your first transaction
        </a>
      </div>

      <div class="table-responsive" th:if="${!transactions.isEmpty()}">
        <table class="table mb-0">
          <thead>
            <tr>
              <th class="ps-4">Description</th>
              <th>Type</th>
              <th>Category</th>
              <th>Date</th>
              <th class="text-end">Amount</th>
              <th class="text-center pe-4">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="tx : ${transactions.content}">
              <td class="ps-4">
                <div style="font-size:13px;font-weight:500;" th:text="${tx.description}"></div>
                <div style="font-size:11.5px;color:var(--text-muted);"
                     th:if="${tx.notes != null and !tx.notes.isEmpty()}"
                     th:text="${tx.notes}"></div>
              </td>
              <td>
                <span class="badge"
                      th:classappend="${tx.type.name() == 'INCOME'} ? 'bg-success' : 'bg-danger'"
                      th:text="${tx.type.name()}"></span>
              </td>
              <td>
                <span class="badge bg-light" th:text="${tx.category.name()}"></span>
              </td>
              <td style="color:var(--text-secondary);font-size:13px;"
                  th:text="${#temporals.format(tx.transactionDate, 'dd MMM yyyy')}"></td>
              <td class="text-end"
                  th:classappend="${tx.type.name() == 'INCOME'} ? 'amount-income' : 'amount-expense'"
                  th:text="${(tx.type.name() == 'INCOME' ? '+R' : '-R') + #numbers.formatDecimal(tx.amount, 1, 'COMMA', 2, 'POINT')}">
              </td>
              <td class="text-center pe-4">
                <div class="d-flex gap-1 justify-content-center">
                  <a th:href="@{/transactions/{id}/edit(id=${tx.id})}"
                     class="btn btn-sm btn-outline-primary">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                      <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                      <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                  </a>
                  <form th:action="@{/transactions/{id}/delete(id=${tx.id})}"
                        method="post" class="d-inline"
                        onsubmit="return confirm('Delete this transaction?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                        <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2" stroke="currentColor" stroke-width="2"/>
                      </svg>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-between align-items-center px-4 py-3"
           style="border-top:1px solid var(--border);"
           th:if="${transactions.totalPages > 1}">
        <span style="font-size:12.5px;color:var(--text-secondary);">
          Page <span th:text="${transactions.number + 1}"></span>
          of <span th:text="${transactions.totalPages}"></span>
        </span>
        <nav>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${!transactions.hasPreviousPage()} ? 'disabled'">
              <a class="page-link" th:href="@{/transactions(page=${transactions.number - 1})}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                  <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
            </li>
            <li class="page-item" th:classappend="${!transactions.hasNextPage()} ? 'disabled'">
              <a class="page-link" th:href="@{/transactions(page=${transactions.number + 1})}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                  <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
